<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RisBo.js — Todo</title>
    <link rel="stylesheet" href="/examples/style.css" />
    <style>body { padding: 80px 20px; } .app { max-width: 520px; }</style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/examples/theme.js"></script>
    <script type="module">
      import { signal, computed, h, render, For, Show, model } from "/src/index.js";

      function TodoApp() {
        let nextId = 1;
        const todos = signal([
          { id: nextId++, text: "Learn RisBo.js signals", done: true },
          { id: nextId++, text: "Build something delightful", done: false },
        ]);
        const draft = signal("");
        const filter = signal("all"); // all | active | done

        const visible = computed(() =>
          todos().filter((t) =>
            filter() === "all" ? true : filter() === "done" ? t.done : !t.done
          )
        );
        const remaining = computed(() => todos().filter((t) => !t.done).length);

        const add = () => {
          const text = draft().trim();
          if (!text) return;
          todos.update((list) => [...list, { id: nextId++, text, done: false }]);
          draft.set("");
        };
        const toggle = (id) =>
          todos.update((l) => l.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
        const remove = (id) => todos.update((l) => l.filter((t) => t.id !== id));

        const Tab = (value, label) =>
          h("button", { class: () => (filter() === value ? "active" : ""), "on:click": () => filter.set(value) }, label);

        return h("div", { class: "app stack" },
          h("a", { class: "brand", href: "/" }, h("span", { class: "logo" }), " RisBo", h("span", { class: "muted" }, ".js")),
          h("p", { class: "muted" }, () => {
            const n = remaining();
            return n === 0 ? "All done — nice." : `${n} item${n === 1 ? "" : "s"} left to do.`;
          }),
          h("div", { class: "card stack", style: "gap:18px" },
            h("form", { class: "row", "on:submit": (e) => { e.preventDefault(); add(); } },
              h("input", { type: "text", placeholder: "What needs doing?", ...model(draft) }),
              h("button", { class: "primary", type: "submit" }, "Add")),
            h("div", { class: "spread" },
              h("div", { class: "tabs" }, Tab("all", "All"), Tab("active", "Active"), Tab("done", "Done")),
              h("span", { class: "faint", style: "font-size:13px" }, () => `${visible().length} shown`)),
            h(Show, {
                when: () => visible().length > 0,
                fallback: () => h("p", { class: "faint", style: "padding:10px 4px" }, "Nothing here yet."),
              },
              () => h("ul", { class: "list" },
                h(For, { each: () => visible(), by: (t) => t.id },
                  (todo) => h("li", { class: todo.done ? "done" : "" },
                    h("input", { type: "checkbox", checked: todo.done, "on:change": () => toggle(todo.id) }),
                    h("span", { class: "label" }, todo.text),
                    h("button", { class: "ghost danger btn-sm", "on:click": () => remove(todo.id) }, "Delete")))))));
      }

      render(TodoApp, document.getElementById("app"));
    </script>
  </body>
</html>
