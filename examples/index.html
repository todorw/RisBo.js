<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RisBo.js — Examples</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: #131a26;
        --border: #233044;
        --text: #e6edf6;
        --muted: #8aa0b8;
        --brand: #5b8cff;
        --brand-2: #46e0c0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 70% -10%, #18243a 0%, var(--bg) 60%);
        color: var(--text); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: grid; place-items: center; padding: 48px 20px;
      }
      .wrap { width: 100%; max-width: 720px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 0 24px #5b8cff66; }
      p.lead { color: var(--muted); margin-top: 6px; }
      .grid { display: grid; gap: 14px; margin-top: 28px; }
      a.card {
        display: block; text-decoration: none; color: inherit; background: var(--panel);
        border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; transition: .18s;
      }
      a.card:hover { border-color: var(--brand); transform: translateY(-2px); }
      a.card h3 { margin: 0 0 4px; font-size: 17px; }
      a.card span { color: var(--muted); font-size: 14px; }
      footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
      code { background: #0d1320; border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand"><span class="dot"></span> RisBo.js</div>
      <p class="lead">A fast, fine-grained reactive UI framework — zero dependencies.</p>
      <div class="grid">
        <a class="card" href="/examples/counter/">
          <h3>Counter →</h3><span>Signals, reactive text and event handlers.</span>
        </a>
        <a class="card" href="/examples/todo/">
          <h3>Todo app →</h3><span>Store, keyed <code>For</code> lists, <code>Show</code>, computeds.</span>
        </a>
        <a class="card" href="/examples/router/">
          <h3>Router →</h3><span>Client-side routing with params and links.</span>
        </a>
      </div>
      <footer>Run with <code>npm run dev</code>. Built with RisBo.js.</footer>
    </main>
  </body>
</html>
